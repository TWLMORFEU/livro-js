<!DOCTYPE html>
<html lang="Pt-Br">
<head>
    <meta charset="pt-br>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>conhecendo melhor</title>
</head>
<body>
    <h1>Me fale sobre você:</h1>

    <style>
       body h1 {
           color: black;
        }
    </style>

    <script>
        const nomeUsuario = window.prompt("Qual seu nome ?")
        window.alert("É um prazer conhecelo," + nomeUsuario)

        /* Exemplo  simples de numero inteiro e real utilizando NUmber.parseInt(n) -> inteiro e Number.parseFloat -> Real */

        let idadeInicio = Number.parseFloat(window.prompt("Qual idade iníciou em tecnologia ?"));

        let idadeFinal = Number.parseFloat(window.prompt("Qual idade chegou a finalizar seu periodo de conclusão escolar ?"));

        // window.alert("Sua idade de ínicio, + a de conclusão escolar, esta de: " + (idadeInicio + idadeFinal));

        document.write('sua idade mais seu fim escolar somam, ' + (idadeFinal + idadeInicio))

        /*
        comando toFixed(2) -> duas casas ao fim do numero, ex  R$ 55,843,77
        Comando para substituir -> replace
        comando para utilizar string localizavel, por parte do mundo -> toLocalString('pt-br')
        comando, objeto para mostrar em valor monetario, currency: BRL
        
        juntando fica R$ 1,567,54
        */
    </script>

</body>
</html>
