<!DOCTYPE html>
<html lang="Pt-Br">
<head>
    <meta charset="pt-br>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
</head>

<style>
div#area {
    font: normal 20pt Arial;
    background: rgb(42, 139, 42);
    color: white;
    width: 200px;
    height: 200px;
    line-height: 200px;
    text-align: center;


    /*Eventos DOM, Eventos de mouse: mouse move, mouse doown, mouseup, mouseemter, mouseout, click*/
};

</style>

<body>
    <div id = "area" onclick = "clicar()" onmouseenter="entrar()" onmouseout= "sair()">
      Interaja...
    </div>

<script>
   let a = window.document.getElementById('area')
   
      
   function clicar() { 
       a.innerText = 'clicou!'
       a.style.background = 'red'
   }

   function entrar() {
       a.innerText = 'entrar'
   }

   function sair() {
     a.innerText = 'saiu'
     a.style.background = 'green'
   }

</script>

</body>

</body>
</html>
